[project]
name = "tinyspeech"
version = "0.1.0"
description = "A small single-speaker English text-to-speech system (FastSpeech2-style acoustic model and GAN vocoder)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "librosa>=0.10",
    "numpy",
    "pyyaml",
    "soundfile",
    "pyworld",
    "textgrid",
    "wandb",
    "researchtree",
]

[project.optional-dependencies]
eval = ["openai-whisper", "pysptk", "fastdtw"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyspeech"]
