# Acoustic model: phoneme ids -> 80-bin log-mel spectrogram (FastSpeech2-style).

encoder:
  layers: 4
  hidden: 256
  heads: 2
  conv_kernel: 9
  dropout: 0.2

variance:
  durations: learned      # targets from the model's own alignment (tinyspeech/models/aligner.py)
  pitch:
    level: phoneme        # one value per phoneme
    bins: 256
    log_f0_std: 0.183     # corpus standard deviation of log-F0 (data/features/stats.npy)
    clamp: [-2.1, 2.6]    # 2nd and 98th percentile of normalized phoneme pitch
  energy:
    level: phoneme
    bins: 256
  predictor:
    layers: 2
    kernel: 3
    dropout: 0.5

decoder:
  type: conformer         # Conformer blocks
  layers: 4
  hidden: 256
  heads: 2
  conv_kernel: 31         # depthwise convolution
  ff_mult: 4
  dropout: 0.2

postnet:
  layers: 5
  channels: 512
  kernel: 5

audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  fmin: 0
  fmax: 8000

context:
  model: bert-base-uncased   # frozen; one vector per word, added to that word's phonemes
